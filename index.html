<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Meowtrix</title><style>
/* Tokens from DESIGN.md. */
:root {
  --background: #FFF9F3;
  --surface: #FFFFFF;
  --text: #49353F;
  --text-secondary: #806C75;
  --action-ink: #1A6E4A;
  --warning-ink: #CC3D1A;
  --divider: #E9DED7;
  --rule-card: #FAF2EB;
  --rule-ink: #9E574F;
  --gift: #B88742;
}

* { box-sizing: border-box; }

/* No double-tap zoom anywhere: a tap beside the board is a missed cell. */
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }

body {
  margin: 0;
  background: var(--background);
  color: var(--text);
  font: 17px/1.35 ui-rounded, "SF Pro Rounded", "PingFang SC", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

main {
  max-width: 460px;
  margin: 0 auto;
  padding: max(14px, env(safe-area-inset-top)) 0 max(20px, env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
}

header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
}
header .app-icon { border-radius: 9px; flex-shrink: 0; }
header .wordmark { width: 170px; height: auto; min-width: 0; object-fit: contain; }
header span { margin-left: auto; font-size: 13px; color: var(--text-secondary); }

#goal {
  margin: 18px 16px 12px;
  font-size: 22px;
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
  text-wrap: balance;
}

#rules {
  list-style: none;
  margin: 0 16px;
  padding: 0;
  display: flex;
  gap: 6px;
}
#rules li {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px 6px;
  border-radius: 12px;
  background: var(--rule-card);
  color: var(--rule-ink);
  font-size: 12px;
  font-weight: 600;
  line-height: 1.2;
  text-align: center;
  text-wrap: balance;
}

#status {
  display: flex;
  justify-content: space-between;
  margin: 18px 16px 12px;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 12px;
  border-radius: 16px;
  background: var(--surface);
  box-shadow: 0 2px 6px rgb(73 53 63 / .08);
  font-size: 15px;
  font-variant-numeric: tabular-nums;
}
.pill svg { width: 16px; height: 16px; fill: var(--gift); }

/* The board: compact appearance, 4px from the screen edge. */
#board-frame { position: relative; margin: 0 4px; }
#board {
  display: grid;
  grid-template-columns: repeat(var(--n), var(--cell));
  gap: calc(var(--cell) * .08);
  justify-content: center;
  padding: 2px 0;
  border-radius: 6px;
  background: var(--surface);
  box-shadow: 0 5px 14px rgb(73 53 63 / .10);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
}
.cell {
  position: relative;
  width: var(--cell);
  height: var(--cell);
  border-radius: 4px;
  overflow: hidden;
  background:
    linear-gradient(var(--lip), var(--lip)) bottom / 100% clamp(1px, 7%, 4px) no-repeat,
    linear-gradient(var(--top), var(--mid) 55%, var(--low));
}
.cell > * {
  position: absolute;
  animation: mark .16s ease-out;
}
@keyframes mark { from { opacity: 0; transform: scale(0); } }

.cross { inset: 0; width: 100%; height: 100%; }
.cross path { stroke: var(--ink); stroke-width: 12; stroke-linecap: round; fill: none; }

.wrong { inset: 0; width: 100%; height: 100%; }
.wrong path { stroke: #fff; stroke-width: 23; stroke-linecap: round; fill: none; }
.wrong path + path { stroke: var(--warning-ink); stroke-width: 15; }

.cat {
  inset: 8%;
  border-radius: 50%;
  background: linear-gradient(#fff, #FFEEDD);
  box-shadow: 0 calc(var(--cell) * .043) calc(var(--cell) * .043) rgb(73 53 63 / .28);
  display: grid;
  place-items: center;
}
.paw { width: 85.7%; height: 85.7%; fill: var(--text); }

.refused { animation: shake .32s; }
@keyframes shake {
  20%, 60% { transform: translateX(-7%); }
  40%, 80% { transform: translateX(7%); }
}
.clash .cat { animation: clash .5s; }
@keyframes clash { 30% { transform: scale(1.14); box-shadow: 0 0 0 3px var(--warning-ink); } }

#toast {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  padding: 10px 16px;
  border-radius: 14px;
  background: var(--surface);
  box-shadow: 0 8px 24px rgb(73 53 63 / .18);
  color: var(--warning-ink);
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity .2s;
}
#toast.shown { opacity: 1; }

#gestures {
  margin: 16px 16px 0;
  font-size: 13px;
  color: var(--text-secondary);
  text-align: center;
}
#gestures b { color: var(--text); font-weight: 700; }
#gestures span { margin: 0 8px; }


[hidden]{display:none!important}h1{font-size:22px;margin:22px 16px 14px;text-align:center}button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--divider);border-radius:14px;background:white;padding:12px;box-shadow:0 3px 0 var(--divider)}button:disabled{opacity:.45}button:active{transform:translateY(1px)}.picker{margin:0 16px;background:var(--action-ink);color:white;border:0;min-height:48px}#status{display:block;min-height:44px;font-size:14px;line-height:1.5;color:var(--text-secondary);text-align:center}#board button{padding:0;border:0;box-shadow:none}#palette{display:flex;flex-wrap:wrap;gap:8px;margin:16px}#palette button{min-width:36px;height:36px;padding:4px}button[aria-pressed=true]{outline:3px solid var(--text);outline-offset:2px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px}.actions button{flex:1;font-size:14px;min-width:100px}.actions button:first-child{color:var(--action-ink);font-weight:700}.hud{display:flex;justify-content:space-between;margin:14px 16px 10px}footer{font-size:11px;color:var(--text-secondary);text-align:center;margin:20px 16px}#preview{max-height:200px;max-width:100%;display:block;margin:auto}details{margin:12px 16px;font-size:13px;color:var(--text-secondary)}#celebration{margin:16px;padding:24px;border-radius:20px;background:radial-gradient(at top,#ffdc7c,#ffefc4 60%,var(--background));color:#7a421c;font-size:22px;font-weight:800;text-align:center}

// Shared browser board rules, art and gestures. No storage, network or page chrome.
const MeowtrixBoard = (() => {
const EMPTY = 0, EXCLUDED = 1, CAT = 2, MISTAKE = 3;

function parsePuzzle(puzzle) {
  const regions = puzzle.regions.map((row) =>
    [...row].map((id) => parseInt(id, 36)),
  );
  return {
    id: puzzle.id,
    size: regions.length,
    regions,
    cats: [...puzzle.cats].map((column) => parseInt(column, 36)),
    slots: regionSlots(puzzle.id, regions, puzzle.picture === true),
  };
}

/// Which of the twelve palette colors each Region takes: the app's draw
/// (RegionSlots in lib/presentation/theme.dart), so the board has the colors
/// the player saw. A board painted as a picture keeps its own.
function regionSlots(id, regions, picture) {
  const ids = [...new Set(regions.flat())].sort((a, b) => a - b);
  if (picture) return new Map(ids.map((region) => [region, region % 12]));
  let seed = 0x811c9dc5;
  for (let i = 0; i < id.length; i++) {
    seed = Math.imul(seed ^ id.charCodeAt(i), 0x01000193) >>> 0;
  }
  if (seed === 0) seed = 0x811c9dc5;
  const next = () => {
    seed = (seed ^ (seed << 13)) >>> 0;
    seed = (seed ^ (seed >>> 17)) >>> 0;
    seed = (seed ^ (seed << 5)) >>> 0;

    const marks = button(el('palette'), '× / ●', () => { paint = -1; render(); });
    marks.setAttribute('aria-pressed', String(paint === -1));
    palette.forEach((color, i) => {
      const b = button(el('palette'), String(i + 1), () => { paint = i; render(); });
      b.style.background = color; b.setAttribute('aria-pressed', String(paint === i));
    });
    button(el('actions'), tr('screenshotContinue'), () => {
      const result = solveImported(cleanBoard());
      if (result.status !== 'unique') { status(result.status === 'budget' ? 'screenshotBudget' : result.status === 'multiple' ? 'screenshotMultiple' : 'screenshotInvalid'); return; }
      solution = result.solutions[0].map(index => index % size); playing = true; paint = -1; history = []; finished = false; started = Date.now();
      clearInterval(timer); timer = setInterval(updateCount,1000);
      status(solveImported(cleanBoard(), true).status === 'none' ? 'screenshotConflict' : 'screenshotPlaying'); render();
    });
  } else {
    const undoButton = button(el('actions'), tr('screenshotUndo'), undo);
    undoButton.disabled = !history.length;
    button(el('actions'), tr('screenshotCheck'), () => {
      const result = solveImported(cleanBoard(), true).status;
      status(result === 'none' || result === 'invalid' ? 'screenshotConflict' : result === 'budget' ? 'screenshotBudget' : 'screenshotConsistent');
    });
    button(el('actions'), tr('screenshotEdit'), () => { playing = false; finished = false; clearInterval(timer); board.cells = cleanBoard().cells; history = []; el('celebration').hidden = true; status('screenshotReview'); render(); });
    const at = (r,c) => r*size+c;
    const get = (r,c) => cells[at(r,c)];
    const set = (r,c,value) => {
      const i = at(r,c); cells[i] = value; tiles[i].innerHTML = MeowtrixBoard.mark(value);
      tiles[i].setAttribute('aria-label', `${r+1}, ${c+1}: ${['–','×','●','×'][value]}`); updateCount();
    };
    const locked = (r,c) => get(r,c) === 3 || (get(r,c) === 2 && solution[r] === c);
    const begin = () => { history.push([...cells]); undoButton.disabled = false; };
    const placeCat = (r,c) => {
      if (solution[r] !== c) {
        set(r,c,3); status('screenshotWrong');
        tiles[at(r,c)].classList.remove('refused'); void tiles[at(r,c)].offsetWidth; tiles[at(r,c)].classList.add('refused'); return;
      }
      set(r,c,2); status('screenshotPlaying');
      if (cells.filter(v=>v===2).length === size && solution.every((col,row)=>get(row,col)===2)) {
        finished = true; clearInterval(timer); status('screenshotSolved'); el('celebration').hidden = false;
      }
    };
    const taps = MeowtrixBoard.createTapHandler({get,set,locked,begin,placeCat});
    MeowtrixBoard.bindInput(el('board'),{size,get,set,locked,begin,tap:taps.tap,resetTap:taps.reset,finished:()=>finished || pending});
  }
  el('gestures').textContent = playing ? tr('screenshotPlaying') : tr('screenshotReview'); updateCount();
}
new ResizeObserver(() => { if (board) el('board').style.setProperty('--cell', `${(el('board').clientWidth-4)/(board.size+.08*(board.size-1))}px`); }).observe(el('game'));
el('choose').addEventListener('click', () => el('photo').click());
el('photo').addEventListener('change', async event => {
  const file = event.target.files[0]; event.target.value = '';
  if (!file || pending) return;
  pending = true; el('photo').disabled = true; el('choose').disabled = true; status('screenshotLoading');
  let url;
  try {
    url = URL.createObjectURL(file);
    const image = new Image(); image.src = url; await image.decode();
    const scale = Math.min(1, 600 / image.naturalWidth, 1200 / image.naturalHeight);
    const canvas = document.createElement('canvas'); canvas.width = Math.max(1, Math.floor(image.naturalWidth * scale)); canvas.height = Math.max(1, Math.floor(image.naturalHeight * scale));
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
    await new Promise(resolve => setTimeout(resolve, 30));
    const next = transcribeScreenshot(ctx.getImageData(0, 0, canvas.width, canvas.height));
    clearInterval(timer); started = null; finished = false; el('celebration').hidden = true; board = next; playing = false; paint = -1; history = [];
    if (sourceURL) URL.revokeObjectURL(sourceURL); sourceURL = url; url = null;
    el('preview').src = sourceURL; el('source').hidden = false;
    status('screenshotReview'); render();
  } catch { status('screenshotFailed'); }
  finally { if (url) URL.revokeObjectURL(url); pending = false; el('photo').disabled = false; el('choose').disabled = false; }
});
el('title').textContent = tr('screenshotTool'); el('choose').textContent = tr('screenshotChoose');
el('sourceLabel').textContent = tr('screenshotWebSource'); el('version').textContent = `Meowtrix · ${buildVersion}`;
document.documentElement.lang = catalogs[locale] ? locale : 'en'; status('screenshotIntro');

for (const key of ['ruleOneColorOneCat','ruleOneCatPerRowAndColumn','ruleCatsCannotTouch']) { const li = document.createElement('li'); li.textContent = tr(key); el('rules').append(li); }
el('celebration').textContent = tr('screenshotSolved');
</script></body></html>
