const distance = (a, b) => Math.hypot(...a.map((v, i) => v - b[i]));

function transcribeImage({ width, height, data }, gradientFallback) {

      const x = xs[0] + c * pitch, y = ys[0] + r * pitch;
      const t = peers.find(t => Math.abs(t.x - x) < pitch * .12 && Math.abs(t.y - y) < pitch * .12);
      if (t) { rows[r]++; columns[c]++; }
      grid.push(t || { x, y, w: anchor.w, h: anchor.w, inferred: true });
    }
    const support = rows.reduce((a, b) => a + b, 0);
    if (support < n * n * .60 || Math.min(...rows, ...columns) < n * .4) continue;
    if (continues(xs[0], ys[0], n, pitch, anchor.w)) continue;

    // with wider aspect and fill-color tolerances, preserving ordinary-board behavior.
    if (!gradientFallback) return transcribeImage({ width, height, data }, true);

  // color using the median board tile size, not that component's footprint.

  const colorWidth = widths[Math.floor(widths.length / 2)];

    {

      // Corners and peripheral fill outweigh the central sprite; skip the rim.
      const bins = new Map(), neutralBins = new Map();
      const extent = Math.floor(colorWidth * .46);

      // instead of rejecting a cell when highlight filtering removes all votes.
      const dominant = [...(bins.size ? bins : neutralBins).values()].sort((a, b) => b.count - a.count)[0];
      if (!dominant) throw Error('color');
      tile.base = dominant.sum.map(v => Math.round(v / dominant.count));
      if (tile.inferred || best.occluded) uncertain.push(index);
    }
    let region = palette.findIndex(p => distance(p, tile.base) < (gradientFallback ? 40 : 30));
    if (region < 0) { region = palette.length; palette.push(tile.base); }
    regions.push(region);

      const p = (Math.round(tile.y + y) * width + Math.round(tile.x + x));
      if (distance(rgb(p), tile.base) > 55) points.push([x, y]);
    }

    const quadrants = [0, 0, 0, 0];
    for (const [x, y] of points) quadrants[(x > 0 ? 1 : 0) + (y > 0 ? 2 : 0)]++;

    if (!cross && !uncertain.includes(index)) uncertain.push(index); // Arbitrary sprites require visual review.
  }
  return { size: best.size, regions, cells, palette: palette.map(p => '#' + p.map(v => v.toString(16).padStart(2, '0')).join('')), uncertain };
}

// Bounded exhaustive rule check. A budget exhaustion is never reported as unique.
function solveImported(board, respectMarks = false, budget = 250000) {
  const { size: n, regions, cells } = board;
  if (!Number.isInteger(n) || n < 4 || n > 16 || regions.length !== n * n || cells.length !== n * n || new Set(regions).size !== n || !cells.every(v => [0, 1, 2].includes(v))) return { status: 'invalid', solutions: [] };

    const cats = respectMarks ? cells.slice(row * n, (row + 1) * n).flatMap((v, c) => v === 2 ? [c] : []) : [];
    if (cats.length > 1) return [];
    const result = [];
    for (let c = 0; c < n; c++) {
      const i = row * n + c;
      if (respectMarks && (cells[i] === 1 || cats.length && cats[0] !== c)) continue;
      if (columns.has(c) || used.has(regions[i])) continue;
      if ([row - 1, row + 1].some(r => r >= 0 && r < n && chosen[r] >= 0 && Math.abs(chosen[r] % n - c) <= 1)) continue;
      result.push(i);
    }
    return result;
  }
  function visit(depth) {
    if (++steps > budget) { exhausted = true; return; }
    if (depth === n) { solutions.push([...chosen]); return; }
    let options = null;
    const byRegion = new Map();
    for (let r = 0; r < n; r++) if (chosen[r] < 0) {
      const values = candidates(r);
      if (!values.length) return;
      if (!options || values.length < options.length) options = values;
      for (const i of values) { if (!byRegion.has(regions[i])) byRegion.set(regions[i], []); byRegion.get(regions[i]).push(i); }
    }
    for (const region of new Set(regions)) if (!used.has(region)) {
      const values = byRegion.get(region);
      if (!values) return;
      if (values.length < options.length) options = values;
    }
    for (const i of options) {
      const row = Math.floor(i / n), c = i % n, region = regions[i];
      chosen[row] = i; columns.add(c); used.add(region); visit(depth + 1); chosen[row] = -1; columns.delete(c); used.delete(region);
      if (solutions.length >= 2 || exhausted) return;
    }

const locale = new URLSearchParams(location.search).get('lang') || navigator.language.split('-')[0];
